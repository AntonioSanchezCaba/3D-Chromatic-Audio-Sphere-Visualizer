<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromatic Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#030308;overflow:hidden;height:100vh;color:#fff}
#c{position:fixed;inset:0;z-index:1}

/* Panel */
#panel{
  position:fixed;top:20px;left:20px;z-index:10;
  background:rgba(8,10,28,0.82);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:22px;padding:22px;width:290px;
  box-shadow:0 12px 48px rgba(0,0,0,0.6);
}
.brand h1{font-size:17px;font-weight:700;
  background:linear-gradient(135deg,#c084fc,#818cf8,#38bdf8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.brand p{font-size:11px;color:rgba(255,255,255,0.35);margin-top:2px;margin-bottom:16px}

/* Spectrum */
#spec{display:flex;align-items:flex-end;gap:2px;height:32px;
  margin-bottom:14px;padding:5px 8px;
  background:rgba(0,0,0,0.35);border-radius:10px;border:1px solid rgba(255,255,255,0.04)}
.sb{flex:1;border-radius:2px 2px 0 0;min-height:1px;transition:height .06s ease}

/* Notes */
.lbl{font-size:10px;font-weight:600;letter-spacing:1.1px;
  color:rgba(255,255,255,0.3);text-transform:uppercase;margin-bottom:7px}
#noteRow{display:flex;flex-wrap:wrap;gap:5px;min-height:28px;margin-bottom:14px}
.ntag{padding:3px 10px;border-radius:16px;font-size:11px;font-weight:700;
  display:flex;align-items:center;gap:4px;transition:all .3s}
.ndot{width:6px;height:6px;border-radius:50%}

hr{border:none;border-top:1px solid rgba(255,255,255,0.06);margin:12px 0}

/* Buttons */
.btn{width:100%;padding:10px 14px;border:none;border-radius:10px;font-size:13px;
  font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;
  gap:7px;font-family:'Inter',sans-serif;transition:all .2s;position:relative;overflow:hidden}
.btn-p{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;
  box-shadow:0 4px 18px rgba(99,102,241,.4)}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(99,102,241,.55)}
.btn-g{background:rgba(255,255,255,0.05);color:#fff;border:1px solid rgba(255,255,255,0.09)}
.btn-g:hover{background:rgba(255,255,255,0.1)}
.btn-r{background:linear-gradient(135deg,#dc2626,#db2777);color:#fff;
  box-shadow:0 4px 16px rgba(220,38,38,.3)}
.btn-r:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.28;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.brow{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
#fi{display:none}
.fn{font-size:10px;color:rgba(255,255,255,0.4);margin-top:5px;padding:5px 8px;
  background:rgba(0,0,0,0.25);border-radius:7px;word-break:break-all;display:none}
.live{display:flex;align-items:center;gap:7px;margin-top:8px;padding:8px 11px;
  border-radius:9px;background:rgba(74,222,128,0.07);
  border:1px solid rgba(74,222,128,0.15);font-size:11px;color:#4ade80}
.pd{width:6px;height:6px;border-radius:50%;background:#4ade80;
  animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* Wheel */
#wheel{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
.wc{border-radius:7px;aspect-ratio:1;display:flex;align-items:center;
  justify-content:center;font-size:9px;font-weight:800;transition:all .15s;cursor:default}

.sp{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Hint */
#hint{position:fixed;bottom:20px;right:20px;z-index:10;
  background:rgba(8,10,28,0.82);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.07);border-radius:13px;
  padding:12px 16px;font-size:11px;color:rgba(255,255,255,0.45);line-height:1.9}
#hint b{color:rgba(255,255,255,0.75);font-weight:600}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="panel">
  <div class="brand">
    <h1>Chromatic Visualizer</h1>
    <p>Real-time musical note detection</p>
  </div>
  <div id="spec"></div>
  <div class="lbl">Detected Notes</div>
  <div id="noteRow"><span style="color:rgba(255,255,255,0.2);font-size:11px">Waiting for audio…</span></div>
  <hr>
  <div class="lbl">Live Capture</div>
  <button id="capBtn" class="btn btn-p">🎙 Capture Tab Audio</button>
  <div style="font-size:10px;color:rgba(255,255,255,.3);margin-top:5px">Works with Spotify, YouTube, any tab</div>
  <button id="stopBtn" class="btn btn-r" disabled style="margin-top:7px">⏹ Stop</button>
  <div id="lv" style="display:none"></div>
  <hr>
  <div class="lbl">Audio File</div>
  <label for="fi" class="btn btn-g">📁 Choose File</label>
  <input type="file" id="fi" accept="audio/*">
  <div id="fn" class="fn"></div>
  <div class="brow">
    <button id="playBtn"  class="btn btn-g" disabled>▶ Play</button>
    <button id="pauseBtn" class="btn btn-g" disabled>⏸ Pause</button>
  </div>
  <hr>
  <div class="lbl">Chromatic Scale</div>
  <div id="wheel"></div>
</div>

<div id="hint"><b>Drag</b> to rotate &nbsp;·&nbsp; <b>Scroll</b> to zoom<br>Each note = unique color</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── NOTE → COLOR (Hue evenly spaced 0-330°) ─────────────────────────────────────
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTE_HUE = {C:0,['C#']:30,D:60,['D#']:90,E:135,F:165,['F#']:190,G:210,['G#']:240,A:270,['A#']:300,B:330};

function hsl2rgb(h,s,l){
  h/=360; let r,g,b;
  if(!s){r=g=b=l}else{
    const q=l<.5?l*(1+s):l+s-l*s, p=2*l-q;
    const f=(p,q,t)=>{t=(t+1)%1;return t<1/6?p+(q-p)*6*t:t<.5?q:t<2/3?p+(q-p)*(2/3-t)*6:p};
    r=f(p,q,h+1/3);g=f(p,q,h);b=f(p,q,h-1/3);
  }
  return {r,g,b};
}

const NOTE_RGB={};
NOTES.forEach(n=>{NOTE_RGB[n]=hsl2rgb(NOTE_HUE[n],1,0.52)});

// Build wheel
const wEl=document.getElementById('wheel');
NOTES.forEach(n=>{
  const d=document.createElement('div');
  d.className='wc';d.id='wc-'+n;d.textContent=n;
  const h=NOTE_HUE[n];
  d.style.background=`hsl(${h},90%,52%)`;
  d.style.color=h>45&&h<200?'#000':'#fff';
  wEl.appendChild(d);
});

// Build spectrum
const specEl=document.getElementById('spec');
const SB=28;
for(let i=0;i<SB;i++){
  const b=document.createElement('div');b.className='sb';
  b.style.background=`hsl(${(i/SB)*280},90%,58%)`;
  specEl.appendChild(b);
}
const sbEls=[...document.querySelectorAll('.sb')];

// ─── THREE.JS ─────────────────────────────────────────────────────────────────────────────
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setClearColor(0x030308,1);

const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,.1,300);
cam.position.z=6;

// Particles
const PC=2000;
const pG=new THREE.BufferGeometry();
const pp=new Float32Array(PC*3),pc=new Float32Array(PC*3);
for(let i=0;i<PC;i++){
  pp[i*3]=(Math.random()-.5)*90;pp[i*3+1]=(Math.random()-.5)*90;pp[i*3+2]=(Math.random()-.5)*90;
  const h=Math.random()*360,c=hsl2rgb(h,.7,.65);
  pc[i*3]=c.r;pc[i*3+1]=c.g;pc[i*3+2]=c.b;
}
pG.setAttribute('position',new THREE.BufferAttribute(pp,3));
pG.setAttribute('color',new THREE.BufferAttribute(pc,3));
scene.add(new THREE.Points(pG,new THREE.PointsMaterial({
  size:.12,vertexColors:true,transparent:true,opacity:.5,
  blending:THREE.AdditiveBlending,depthWrite:false})));

// Main sphere — high resolution
const SEG=128;
const sGeo=new THREE.SphereGeometry(2,SEG,SEG);
const cnt=sGeo.attributes.position.count;
const vcArr=new Float32Array(cnt*3);
for(let i=0;i<vcArr.length;i+=3){vcArr[i]=.12;vcArr[i+1]=.14;vcArr[i+2]=.28;}
sGeo.setAttribute('color',new THREE.BufferAttribute(vcArr,3));

const sMat=new THREE.MeshPhongMaterial({
  vertexColors:true,shininess:55,
  specular:new THREE.Color(.25,.25,.35),
  emissive:new THREE.Color(.04,.04,.1),
  emissiveIntensity:1,
});
const sphere=new THREE.Mesh(sGeo,sMat);
scene.add(sphere);
const basePos=Float32Array.from(sGeo.attributes.position.array);

// Glow sphere
const gGeo=new THREE.SphereGeometry(2.25,32,32);
const gMat=new THREE.MeshBasicMaterial({
  color:0x5533ff,transparent:true,opacity:.05,
  blending:THREE.AdditiveBlending,depthWrite:false});
const gSph=new THREE.Mesh(gGeo,gMat);
scene.add(gSph);

// Lights
scene.add(new THREE.AmbientLight(0x252540,1.2));
const kL=new THREE.PointLight(0xffffff,1.4,60);kL.position.set(5,6,5);
const fL=new THREE.PointLight(0x4455ff,0.9,60);fL.position.set(-6,-4,5);
const bL=new THREE.PointLight(0xff44ff,0.5,60);bL.position.set(0,0,-7);
scene.add(kL,fL,bL);

// Precompute spherical coords per vertex for wave patterns
const vertTheta=new Float32Array(cnt);
const vertPhi  =new Float32Array(cnt);
for(let i=0;i<cnt;i++){
  const bx=basePos[i*3],by=basePos[i*3+1],bz=basePos[i*3+2];
  vertTheta[i]=Math.atan2(by,bx);
  vertPhi[i]  =Math.acos(Math.max(-1,Math.min(1,bz/2)));
}

// Smooth per-vertex color buffer (for lerping)
const smoothC=new Float32Array(cnt*3);
smoothC.set(vcArr);

// ─── ORBIT CONTROLS ───────────────────────────────────────────────────────────
let drag=false,prevM={x:0,y:0};
canvas.style.cursor='grab';
canvas.addEventListener('mousedown',e=>{drag=true;prevM={x:e.clientX,y:e.clientY};canvas.style.cursor='grabbing'});
window.addEventListener('mouseup',()=>{drag=false;canvas.style.cursor='grab'});
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  sphere.rotation.y+=(e.clientX-prevM.x)*.007;
  sphere.rotation.x+=(e.clientY-prevM.y)*.007;
  prevM={x:e.clientX,y:e.clientY};
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  cam.position.z=Math.max(3,Math.min(12,cam.position.z+e.deltaY*.004));
},{passive:false});
window.addEventListener('resize',()=>{
  cam.aspect=window.innerWidth/window.innerHeight;
  cam.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// ─── AUDIO ───────────────────────────────────────────────────────────────────────────────────
let audioCtx,analyser,freqData;
let audioEl,audioSrc,stream;
let active=false;

function mkAnalyser(){
  audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=8192;            // high freq resolution
  analyser.smoothingTimeConstant=0.55;
  freqData=new Uint8Array(analyser.frequencyBinCount);
}

// ─── NOTE ENVELOPES ─────────────────────────────────────────────────────────────────────
const ENV={};
NOTES.forEach(n=>{ENV[n]=0});
const ATTACK=0.30;
const DECAY =0.06;

// Beat detection
let smoothEnergy=0,beatPulse=0;

// ─── DETECT NOTES ───────────────────────────────────────────────────────────────────────────
function freq2note(f){
  const n=12*Math.log2(f/440)+69;
  const r=Math.round(n);
  return{name:NOTES[((r%12)+12)%12],octave:Math.floor(r/12)-1,cents:(n-r)*100};
}

const rawDetected=new Map();

function detectNotes(){
  if(!analyser||!active)return;
  analyser.getByteFrequencyData(freqData);

  const sr=audioCtx.sampleRate;
  const bw=sr/analyser.fftSize;
  rawDetected.clear();

  let energy=0;
  for(let i=1;i<80;i++)energy+=freqData[i];
  energy/=80;
  const diff=energy-smoothEnergy;
  smoothEnergy+=(energy-smoothEnergy)*.15;
  if(diff>22)beatPulse=Math.min(1,diff/60);

  const WIN=3;
  const THR=70;
  for(let i=WIN;i<Math.min(freqData.length-WIN,3500);i++){
    const amp=freqData[i];
    if(amp<THR)continue;
    let peak=true;
    for(let j=-WIN;j<=WIN;j++){if(j&&freqData[i+j]>=amp){peak=false;break}}
    if(!peak)continue;
    const freq=i*bw;
    if(freq<55||freq>4800)continue;
    const info=freq2note(freq);
    if(Math.abs(info.cents)>60)continue;
    const intensity=Math.min(1,(amp-THR)/(255-THR));
    const k=info.name;
    if(!rawDetected.has(k)||rawDetected.get(k).intensity<intensity)
      rawDetected.set(k,{...info,intensity});
  }

  NOTES.forEach(n=>{
    if(rawDetected.has(n)){
      const target=rawDetected.get(n).intensity;
      ENV[n]+=(target-ENV[n])*ATTACK;
    } else {
      ENV[n]*=(1-DECAY);
      if(ENV[n]<.005)ENV[n]=0;
    }
  });
}

// ─── VISUALIZE ───────────────────────────────────────────────────────────────────────────────────
function visualize(t){
  if(!analyser||!active)return;

  beatPulse*=0.90;

  const posAttr=sGeo.attributes.position;
  const colAttr=sGeo.attributes.color;

  let totalEnv=0;
  NOTES.forEach(n=>{totalEnv+=ENV[n]});

  for(let i=0;i<cnt;i++){
    const i3=i*3;
    const bx=basePos[i3],by=basePos[i3+1],bz=basePos[i3+2];
    const theta=vertTheta[i];
    const phi  =vertPhi[i];

    let wR=0,wG=0,wB=0,wSum=0;
    NOTES.forEach(n=>{
      const e=ENV[n];
      if(e<.005)return;
      const rgb=NOTE_RGB[n];
      const nIdx=NOTES.indexOf(n);
      const phase=(nIdx/12)*Math.PI*2;
      const w1=Math.sin(phi*3+theta*2+t*1.8+phase);
      const w2=Math.cos(phi*5-theta*3+t*1.4+phase+1.0);
      const influence=(w1+w2*.5)/1.5;
      const region=influence*.5+.5;
      const weight=region*e;
      wR+=rgb.r*weight;
      wG+=rgb.g*weight;
      wB+=rgb.b*weight;
      wSum+=weight;
    });

    let fR=.12,fG=.14,fB=.28;
    if(wSum>.01){
      fR=Math.min(.92,wR/wSum);
      fG=Math.min(.92,wG/wSum);
      fB=Math.min(.92,wB/wSum);
    }

    const lerp=.18+beatPulse*.25;
    smoothC[i3  ]+=(fR-smoothC[i3  ])*lerp;
    smoothC[i3+1]+=(fG-smoothC[i3+1])*lerp;
    smoothC[i3+2]+=(fB-smoothC[i3+2])*lerp;
    colAttr.setXYZ(i,smoothC[i3],smoothC[i3+1],smoothC[i3+2]);

    let disp=0;
    if(totalEnv>.01){
      NOTES.forEach(n=>{
        const e=ENV[n];
        if(e<.005)return;
        const nIdx=NOTES.indexOf(n);
        const phase=(nIdx/12)*Math.PI*2;
        const d=Math.sin(phi*6+theta*5+t*2.2+phase)*e*.18;
        disp+=d;
      });
      disp/=Math.max(1,NOTES.filter(n=>ENV[n]>.005).length);
    }
    disp+=beatPulse*.12*Math.sin(phi*8+t*5);

    const sc=1+disp;
    posAttr.setXYZ(i,bx*sc,by*sc,bz*sc);
  }

  posAttr.needsUpdate=true;
  colAttr.needsUpdate=true;

  const domNote=NOTES.reduce((a,b)=>ENV[a]>ENV[b]?a:b);
  if(ENV[domNote]>.05){
    const rgb=NOTE_RGB[domNote];
    sMat.emissive.setRGB(rgb.r*.35,rgb.g*.35,rgb.b*.35);
  } else {
    sMat.emissive.setRGB(.04,.04,.1);
  }
  sMat.emissiveIntensity=0.6+totalEnv*.4+beatPulse*.8;

  if(ENV[domNote]>.05){
    const rgb=NOTE_RGB[domNote];
    gMat.color.setRGB(rgb.r,rgb.g,rgb.b);
  }
  gMat.opacity=.04+beatPulse*.22+totalEnv*.04;
  gSph.scale.setScalar(1+beatPulse*.1);
}

// ─── UI UPDATES ──────────────────────────────────────────────────────────────────────────────
let lastUIUpdate=0;
function updateUI(){
  const now=Date.now();
  if(now-lastUIUpdate<80)return;
  lastUIUpdate=now;

  if(freqData){
    const step=Math.floor(freqData.length/SB/2);
    sbEls.forEach((b,i)=>{
      const v=freqData[i*step]/255;
      b.style.height=Math.max(1,v*28)+'px';
      b.style.opacity=.35+v*.65;
    });
  }

  const row=document.getElementById('noteRow');
  const alive=NOTES.filter(n=>ENV[n]>.08).sort((a,b)=>ENV[b]-ENV[a]);
  if(alive.length===0){
    row.innerHTML='<span style="color:rgba(255,255,255,0.2);font-size:11px">No notes detected…</span>';
  } else {
    row.innerHTML='';
    alive.slice(0,8).forEach(n=>{
      const h=NOTE_HUE[n],e=ENV[n];
      const bg=`hsl(${h},88%,52%)`;
      const el=document.createElement('div');
      el.className='ntag';
      el.style.background=bg;
      el.style.color=h>45&&h<200?'#000':'#fff';
      el.style.opacity=.4+e*.6;
      el.style.transform=`scale(${.85+e*.2})`;
      const oct=rawDetected.has(n)?rawDetected.get(n).octave:'';
      el.innerHTML=`<div class="ndot" style="background:rgba(0,0,0,.3)"></div>${n}${oct}`;
      row.appendChild(el);
    });
  }

  NOTES.forEach(n=>{
    const el=document.getElementById('wc-'+n);if(!el)return;
    const h=NOTE_HUE[n],e=ENV[n];
    if(e>.05){
      el.style.transform=`scale(${1+e*.3})`;
      el.style.boxShadow=`0 0 ${e*16}px hsl(${h},100%,60%)`;
    } else {
      el.style.transform='scale(1)';
      el.style.boxShadow='none';
    }
  });
}

// ─── ANIMATION LOOP ─────────────────────────────────────────────────────────────────────────────────
let rotSpeed=.0015;
function animate(ts){
  requestAnimationFrame(animate);
  const t=ts*.001;

  detectNotes();
  visualize(t);
  updateUI();

  const totalEnv=NOTES.reduce((s,n)=>s+ENV[n],0);
  const target=.0012+beatPulse*.015+totalEnv*.0005;
  rotSpeed+=(target-rotSpeed)*.04;
  sphere.rotation.y+=rotSpeed;
  gSph.rotation.y-=rotSpeed*.4;
  gSph.rotation.x+=rotSpeed*.2;

  scene.children.forEach(c=>{if(c instanceof THREE.Points)c.rotation.y+=.00008});

  renderer.render(scene,cam);
}
animate(0);

// ─── AUDIO CONTROLS ──────────────────────────────────────────────────────────────────────────────
const capBtn  =document.getElementById('capBtn');
const stopBtn =document.getElementById('stopBtn');
const playBtn =document.getElementById('playBtn');
const pauseBtn=document.getElementById('pauseBtn');
const lvEl    =document.getElementById('lv');

function stopAll(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  if(audioEl)audioEl.pause();
  if(audioSrc)try{audioSrc.disconnect()}catch(e){}
  active=false;
  NOTES.forEach(n=>{ENV[n]=0});
  stopBtn.disabled=true;
  lvEl.style.display='none';
}

async function captureTab(){
  stopAll();
  capBtn.innerHTML='<span class="sp"></span> Waiting…';
  capBtn.disabled=true;
  try{
    stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:{
      echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    stream.getVideoTracks().forEach(t=>{t.stop();stream.removeTrack(t)});
    if(!stream.getAudioTracks().length)throw new Error('No audio');
    mkAnalyser();
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    active=true;
    stream.getAudioTracks()[0].onended=stopAll;
    stopBtn.disabled=false;
    lvEl.innerHTML='<div class="live"><div class="pd"></div>Capturing tab audio…</div>';
    lvEl.style.display='block';
  }catch(e){
    alert('Capture failed.\n\n1. Select a tab\n2. Check \'Share audio\'\n3. Click Share');
  }
  capBtn.innerHTML='🎙 Capture Tab Audio';
  capBtn.disabled=false;
}

function initFile(file){
  stopAll();
  mkAnalyser();
  audioEl=new Audio();
  audioEl.src=URL.createObjectURL(file);
  audioSrc=audioCtx.createMediaElementSource(audioEl);
  audioSrc.connect(analyser);
  analyser.connect(audioCtx.destination);
  playBtn.disabled=false;
  pauseBtn.disabled=false;
}

capBtn.addEventListener('click',captureTab);
stopBtn.addEventListener('click',stopAll);

document.getElementById('fi').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const fn=document.getElementById('fn');
  fn.textContent='📄 '+f.name;fn.style.display='block';
  initFile(f);
});

playBtn.addEventListener('click',()=>{
  if(!audioEl)return;
  if(audioCtx.state==='suspended')audioCtx.resume();
  audioEl.play();active=true;
  lvEl.innerHTML='<div class="live"><div class="pd"></div>Playing…</div>';
  lvEl.style.display='block';
});

pauseBtn.addEventListener('click',()=>{
  if(audioEl)audioEl.pause();
  active=false;lvEl.style.display='none';
});
</script>
